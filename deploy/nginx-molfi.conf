# nginx для molfi.uz и admin.molfi.uz
#
#   sudo cp deploy/nginx-molfi.conf /etc/nginx/sites-available/molfi
#   sudo ln -sf /etc/nginx/sites-available/molfi /etc/nginx/sites-enabled/molfi
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификаты выпускает certbot, он же допишет сюда строки listen 443
# и пути к ключам:
#   sudo certbot --nginx -d molfi.uz -d www.molfi.uz -d admin.molfi.uz
#
# Ставить этот файл до выпуска сертификата — правильный порядок:
# certbot ищет в конфиге server_name, чтобы понять, для чего выпускать.

# Клиент и лендинг
server {
    listen 80;
    listen [::]:80;
    server_name molfi.uz www.molfi.uz;

    root /home/ai/molfi/apps/web/dist;
    index index.html;

    # Приложение одностраничное: любой адрес отдаёт index.html, а роутер
    # внутри разбирается сам. Без этого /offer и /catalog при перезагрузке
    # страницы вернут 404 — файлов с такими именами на диске нет.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Собранные бандлы содержат хеш в имени: меняется файл — меняется имя,
    # поэтому кешировать можно навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html не кешируем никогда: он единственный знает, какие
    # бандлы актуальны, и застрявшая копия оставит человека на старой версии
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# Админка
server {
    listen 80;
    listen [::]:80;
    server_name admin.molfi.uz;

    root /home/ai/molfi/apps/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Панель управления деньгами не должна попадать в поиск
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json;
}
