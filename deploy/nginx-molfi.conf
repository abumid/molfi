# nginx for molfi.uz and admin.molfi.uz
#
#   sudo cp deploy/nginx-molfi.conf /etc/nginx/sites-available/molfi
#   sudo ln -sf /etc/nginx/sites-available/molfi /etc/nginx/sites-enabled/molfi
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates are issued by certbot, which also appends the listen 443 lines
# and the key paths here:
#   sudo certbot --nginx -d molfi.uz -d www.molfi.uz -d admin.molfi.uz
#
# Installing this file before the certificate is issued is the right order:
# certbot reads server_name from the config to know what to issue for.

# Client and landing page
server {
    listen 80;
    listen [::]:80;
    server_name molfi.uz www.molfi.uz;

    root /home/ai/molfi/apps/web/dist;
    index index.html;

    # The app is a single page: any address returns index.html and the router
    # inside sorts it out. Without this, /offer and /catalog return 404 on a
    # page refresh — there are no files by those names on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built bundles carry a hash in the file name: change the file and the name
    # changes, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html is never cached: it alone knows which bundles are current, and
    # a stuck copy would leave the person on an old version
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# Admin panel
server {
    listen 80;
    listen [::]:80;
    server_name admin.molfi.uz;

    root /home/ai/molfi/apps/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The money control panel must not end up in search results
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json;
}
